<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="100%" stop-color="#141416" />
    </linearGradient>

    <!-- 3D White Dome Gradient -->
    <radialGradient id="sphereGrad" cx="45%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f2f2f4" />
      <stop offset="85%" stop-color="#dedee2" />
      <stop offset="100%" stop-color="#c4c4c8" />
    </radialGradient>

    <!-- Inner Soft Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Squircle Clip -->
    <clipPath id="squircleClip">
      <rect width="128" height="128" rx="28" />
    </clipPath>
  </defs>

  <!-- Base Squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- Content Cliped to Squircle -->
  <g clip-path="url(#squircleClip)">
    <!-- 3D Organic Dome Body -->
    <path d="M -10 32
             C 15 16, 45 15, 68 22
             C 90 28, 114 42, 120 72
             C 125 94, 118 120, 110 138
             L -10 138 Z"
          fill="url(#sphereGrad)" />

    <!-- Left Capsule Eye -->
    <rect x="53" y="52" width="14" height="34" rx="7"
          fill="#161618"
          transform="rotate(32 60 69)" />

    <!-- Right Capsule Eye -->
    <rect x="91" y="29" width="14" height="34" rx="7"
          fill="#161618"
          transform="rotate(32 98 46)" />
  </g>
</svg>
