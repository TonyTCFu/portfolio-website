<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="eggBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="128" height="128" rx="28" fill="url(#eggBg)" stroke="rgba(244, 63, 94, 0.25)" stroke-width="2" />

  <!-- Iconic Egg / Droplet Shape -->
  <g filter="url(#softGlow)">
    <path d="M64 22 C52 40 40 56 40 76 A24 24 0 0 0 88 76 C88 56 76 40 64 22 Z" fill="url(#dropGrad)" />
    <!-- Subtle Inner Highlight Shine -->
    <ellipse cx="56" cy="68" rx="5" ry="10" transform="rotate(-20 56 68)" fill="#ffffff" opacity="0.35" />
  </g>
</svg>
